; zb自用规则，主要国外服务优先，国内规则靠后，大规则最末尾

; 规则集定义



ruleset=Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Apple/Apple.list


ruleset=Youtube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list

ruleset=Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list

ruleset=Tiktok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list


ruleset=Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list

ruleset=Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.list

ruleset=Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list


ruleset=Geosite,[]Geosite,geolocation-!cn


ruleset=漏网之鱼,[]FINAL



; 策略组定义

custom_proxy_group=代理`url-test`[]香港`[]日本`[]美国`http://www.gstatic.com/generate_204`110,,50

custom_proxy_group=Ai专用`url-test`[]日本`[]美国`http://www.gstatic.com/generate_204`110,,50

custom_proxy_group=直连`select`[]DIRECT



; 规则绑定（严格对应规则集顺序）


custom_proxy_group=Apple`select`[]直连


custom_proxy_group=Youtube`select`[]代理

custom_proxy_group=Telegram`select`[]代理

custom_proxy_group=Tiktok`select`[]代理


custom_proxy_group=Ai`select`[]Ai专用


custom_proxy_group=Geosite`select`[]代理


custom_proxy_group=漏网之鱼`select`[]直连`[]代理



custom_proxy_group=香港`url-test`(?=.*(香港|HK|Hk|hk|HongKong))^(?!.*(IPV6|ipv6))`http://www.gstatic.com/generate_204`100,,50

custom_proxy_group=日本`url-test`(?=.*(日本|JP|Jp|jp|Japan))^(?!.*(IPV6|ipv6))`http://www.gstatic.com/generate_204`100,,50

custom_proxy_group=美国`url-test`(?=.*(美国|US|Us|us|States))^(?!.*(IPV6|ipv6))`http://www.gstatic.com/generate_204`100,,50



enable_rule_generator=true

overwrite_original_rules=true